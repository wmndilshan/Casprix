name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to VERSION
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
          grep -Fq "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md

  build:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar
          - name: windows-x86_64
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential nasm zlib1g-dev
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-zlib
            zip
      - name: Build, test, and install (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --preset release -DCMAKE_INSTALL_PREFIX="$PWD/stage/casprix"
          cmake --build --preset release --parallel
          ctest --test-dir build/release --output-on-failure
          cmake --install build/release
          stage/casprix/bin/casprix --version
          tar -czf "casprix-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C stage casprix
      - name: Build, test, and install (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --preset release -DCMAKE_INSTALL_PREFIX="$PWD/stage/casprix"
          cmake --build --preset release --parallel
          ctest --test-dir build/release --output-on-failure
          cmake --install build/release
          stage/casprix/bin/casprix.exe --version
          cd stage
          zip -qr "../casprix-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" casprix
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: casprix-${{ matrix.name }}
          path: casprix-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: casprix-*
          merge-multiple: true
          path: artifacts
      - name: Create checksums
        run: cd artifacts && sha256sum casprix-* > SHA256SUMS
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 == "## [" version "]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Casprix ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
