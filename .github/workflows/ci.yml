name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Repository metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and presets
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          cmake --list-presets
          git diff --check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Analyze compiler
        run: |
          cppcheck +            --error-exitcode=1 +            --enable=warning,performance,portability +            --suppress=missingIncludeSystem +            --suppress=unusedFunction +            -I include -I runtime src

  linux:
    name: Linux build, test, and install
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential nasm zlib1g-dev
      - name: Configure
        run: cmake --preset ci -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci
      - name: Install and smoke test
        run: |
          cmake --install build/ci
          stage/bin/casprix --version
          test -f stage/lib/libcasprix_runtime.a
          test -f stage/share/casprix/LICENSE

  windows:
    name: Windows build, test, and install
    runs-on: windows-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-zlib
      - name: Configure
        shell: msys2 {0}
        run: cmake --preset ci -DCMAKE_INSTALL_PREFIX="$PWD/stage"
      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset ci --parallel
      - name: Test
        shell: msys2 {0}
        run: ctest --preset ci
      - name: Install and smoke test
        shell: msys2 {0}
        run: |
          cmake --install build/ci
          stage/bin/casprix.exe --version
          test -f stage/lib/libcasprix_runtime.a
          test -f stage/share/casprix/LICENSE
