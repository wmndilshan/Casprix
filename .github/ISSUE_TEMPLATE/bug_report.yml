name: Bug Report
description: Report a compiler crash, incorrect output, or unexpected behaviour.
title: "bug: "
labels: [ "bug", "needs-triage" ]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Casprix version
      placeholder: "e.g. 1.0.0  (run: casprix --version)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10 / 11
        - Ubuntu 22.04
        - Ubuntu 24.04
        - macOS 13+
        - Other (specify in description)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Lexer / Parser
        - Semantic Analysis / Type Checker
        - Code Generator (x86-64)
        - Runtime (memory, ARC, GC)
        - Runtime (async / coroutines)
        - Runtime (AI / LLM)
        - Runtime (Skia / GUI)
        - Package Manager (cpkg)
        - Standard Library
        - Build System (CMake / Make)
        - Other / Unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Paste the **smallest** `.cpx` file that reproduces the issue.
        If the bug is a crash, include the full error output.
      render: text
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output / error
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Stack traces, compiler flags used, relevant config, etc.
