name: Feature Request
description: Propose a new language feature, standard library addition, or toolchain improvement.
title: "feat: "
labels: [ "enhancement", "needs-triage" ]

body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. The more context you provide,
        the easier it is to evaluate and implement your idea.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language syntax / semantics
        - Type system / generics
        - Standard library (lib/)
        - Runtime — memory / ARC
        - Runtime — async / concurrency
        - Runtime — AI / LLM
        - Runtime — GUI / Skia
        - Compiler performance
        - Package manager (cpkg)
        - IDE integration
        - Documentation
        - Build system
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Is there a workaround today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe what you want. Include example `.cpx` code if applicable.
      render: text
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you prefer this one.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, prior art, related issues, etc.
